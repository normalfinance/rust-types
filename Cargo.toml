[package]
name = "normal-rust-types"
version = "0.1.6"
edition = "2021"
description="A common Rust types library for the entire Normal ecosystem"
license = "Apache-2.0"
authors = ["Jay Malve <jaymalveus@gmail.com>", "Joshua Blew <joshua@normalfinance.io>"]
repository = "https://github.com/normalfinance/rust-types"
documentation = "https://normalfinance.gitbook.io/docs"
keywords = ["stellar", "soroban", "crypto", "normal"]
categories = ["types"]

[dependencies]
soroban-sdk = { version = "22.0.6" }
soroban-fixed-point-math = { version = "1.3.0" }

[lib]
path = "src/lib.rs"
